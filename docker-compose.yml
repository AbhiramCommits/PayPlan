services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payplan}
      POSTGRES_DB: ${POSTGRES_DB:-payplan}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payplan} -d ${POSTGRES_DB:-payplan}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      SEED_DEMO: ${SEED_DEMO:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    command: celery -A payplan worker -l info --concurrency=2
    depends_on:
      - api
      - redis

  beat:
    build: ./backend
    env_file: .env
    command: celery -A payplan beat -l info
    depends_on:
      - api
      - redis

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
